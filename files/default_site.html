<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xos Geldiniz</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            width: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; /* Sehifede scroll aparmamaq ucun */
        }

        .bg-container {
            /* Sekil internetden birbasa yuklenir */
            background-image: url('https://images.unsplash.com/photo-1543466835-00a7907e9de1'); 
            height: 100%;
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover; /* Seklin bütün ekrani doldurmasi ucun */
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Seklin ustunde yazinin yaxsi gorunmesi ucun yungul tundluk overlay-i */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.25);
        }

        .content {
            position: relative;
            z-index: 1;
            text-align: center;
            color: white;
            padding: 20px;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(8px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            max-width: 500px;
        }

        .content h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.6);
        }

        .content p {
            font-size: 1.2rem;
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="bg-container">
        <div class="overlay"></div>
        <div class="content">
            <h1>Xoş Gəldiniz!</h1>
            <p>Hüzur dolu bir gün arzulayırıq...</p>
        </div>
    </div>

</body>
</html>
